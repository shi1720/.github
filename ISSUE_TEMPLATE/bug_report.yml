name: Bug report
description: Describe a reproducible defect with a minimal, sanitized example.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what you tried and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small example using synthetic data. Do not include credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: Commit or release, operating system, runtime and browser if relevant
    validations:
      required: true
